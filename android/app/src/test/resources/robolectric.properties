# Robolectric runtime for the JVM unit tests.
#
# The app targets API 36, and Robolectric's default is the manifest's targetSdk.
# The runtime image for the newest platform is not always published with a
# Robolectric release, and a missing image fails every test class at class
# load time with "UnsupportedOperationException at DefaultSdkProvider" — which
# says nothing about the code under test.
#
# Pinning the tests to API 35 keeps them independent of targetSdk. Individual
# classes still override this with @Config(sdk = [30]) / [34] where the test is
# about a specific platform behaviour.
sdk=35
